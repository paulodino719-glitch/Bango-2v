<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bango V2</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      text-align: center;
    }

    .topo {
      background: #0b0b0b;
      padding: 25px 15px;
      border-bottom: 2px solid #20c55a;
    }

    h1 {
      margin: 0;
      color: #20c55a;
      font-size: 32px;
    }

    .versao {
      color: #aaa;
      margin-top: 5px;
    }

    .conteudo {
      padding: 30px 20px;
    }

    .cartao {
      background: #1b1b1b;
      border-radius: 15px;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .botao {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #20c55a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .rodape {
      margin-top: 40px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>BANGO</h1>
    <div class="versao">V2</div>
  </div>

  <div class="conteudo">

    <div class="cartao">
      <h2>Bem-vindo ao Bango V2</h2>

      <p>
        Uma aplicação pensada para a nossa sociedade angolana.
      </p>

      <button class="botao">Entrar</button>

      <button class="botao">Criar conta</button>
    </div>

    <div class="rodape">
      Bango V2 © 2026
    </div>

  </div>

</body>
</html>
